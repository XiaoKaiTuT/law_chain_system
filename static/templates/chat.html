<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LawChain · 律衡</title>
    <!-- 浏览器标签页图标（就是那个能关闭的标签上的小图） -->
    <link rel="icon" type="image/jpeg" href="/static/data/网页头.jpg">
    <link rel="shortcut icon" type="image/jpeg" href="/static/data/网页头.jpg">
    <link rel="apple-touch-icon" href="/static/data/网页头.jpg">
    <style>
        :root {
            --grass-900: #1f4d33;
            --grass-700: #2f7d4f;
            --grass-500: #3ba55d;
            --grass-300: #8ed6a6;
            --grass-100: #e2f5e4;
            --cream: #f8fbf5;
            --cream-2: #eef6ea;
            --gold: #d9b26a;
            --gold-soft: #f0dcae;
            --ink: #2c3a31;
            --ink-soft: #6d8175;
            --bubble-bot: #ffffff;
            --bubble-user-a: #8ed6a6;
            --bubble-user-b: #3ba55d;
            --radius-lg: 22px;
            --radius-md: 16px;
            --shadow-soft: 0 10px 30px rgba(47, 125, 79, .12);
            --shadow-card: 0 18px 50px rgba(31, 77, 51, .16);
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; margin: 0; }

        body {
            font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1100px 700px at 12% -10%, #dff3e0 0%, rgba(223, 243, 224, 0) 60%),
                radial-gradient(900px 620px at 108% 8%, #fdf3dc 0%, rgba(253, 243, 220, 0) 58%),
                radial-gradient(800px 600px at 50% 120%, #e6f2ff 0%, rgba(230, 242, 255, 0) 60%),
                var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
            overflow: hidden;
            position: relative;
        }

        /* ---------- 背景装饰：漂浮叶片与光点 ---------- */
        .bg-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .leaf {
            position: absolute;
            font-size: 22px;
            opacity: .38;
            filter: drop-shadow(0 4px 8px rgba(59, 165, 93, .22));
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0%   { transform: translate3d(0, 12vh, 0) rotate(0deg) scale(.85); opacity: 0; }
            12%  { opacity: .42; }
            88%  { opacity: .42; }
            100% { transform: translate3d(34px, -108vh, 0) rotate(210deg) scale(1.05); opacity: 0; }
        }
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(46px);
            opacity: .5;
            animation: orbPulse ease-in-out infinite alternate;
        }
        @keyframes orbPulse {
            from { transform: scale(1) translateY(0); opacity: .38; }
            to   { transform: scale(1.16) translateY(-18px); opacity: .6; }
        }

        /* ---------- 主容器 ---------- */
        .app {
            position: relative;
            z-index: 2;
            /* 加宽：原来 min(1080px, 100%)，现在跟随视口宽度 */
            width: min(90vw, 1320px);
            height: min(92vh, 940px);
            background: rgba(255, 255, 255, .82);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(217, 178, 106, .55);
            border-radius: 26px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: appIn .6s cubic-bezier(.22, 1, .36, 1) both;
        }
        @keyframes appIn {
            from { opacity: 0; transform: translateY(18px) scale(.98); }
            to   { opacity: 1; transform: none; }
        }

        /* ---------- 顶栏 ---------- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 22px;
            background: linear-gradient(120deg, rgba(226, 245, 228, .95), rgba(253, 248, 235, .9));
            border-bottom: 1.5px dashed rgba(217, 178, 106, .6);
        }
        .brand-avatar {
            width: 50px; height: 50px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid var(--gold-soft);
            box-shadow: 0 6px 16px rgba(59, 165, 93, .22);
            overflow: hidden;
            animation: brandFloat 4.4s ease-in-out infinite;
        }
        @keyframes brandFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-4px); }
        }
        .brand-text { flex: 1 1 auto; min-width: 0; }
        .brand-title {
            margin: 0;
            font-size: 17px;
            letter-spacing: .5px;
            color: var(--grass-900);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-title .clover { font-size: 15px; }
        .brand-sub {
            margin: 3px 0 0;
            font-size: 12px;
            color: var(--ink-soft);
            letter-spacing: .3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .status-chip {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 13px;
            border-radius: 999px;
            background: #ffffff;
            border: 1.5px solid rgba(217, 178, 106, .55);
            font-size: 12px;
            color: var(--grass-900);
            box-shadow: 0 4px 12px rgba(59, 165, 93, .12);
            white-space: nowrap;
        }
        .status-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #c9d3cd;
            flex: 0 0 auto;
            transition: background .3s ease;
        }
        .status-chip[data-state="connected"] .status-dot {
            background: var(--grass-500);
            box-shadow: 0 0 0 0 rgba(59, 165, 93, .55);
            animation: dotPulse 2s infinite;
        }
        .status-chip[data-state="connecting"] .status-dot { background: var(--gold); animation: dotPulse 1.1s infinite; }
        .status-chip[data-state="offline"] .status-dot { background: #e28b8b; }
        @keyframes dotPulse {
            0%   { box-shadow: 0 0 0 0 rgba(59, 165, 93, .5); }
            70%  { box-shadow: 0 0 0 8px rgba(59, 165, 93, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 165, 93, 0); }
        }
        .latency { color: var(--ink-soft); font-variant-numeric: tabular-nums; }

        /* ---------- 消息流 ---------- */
        .chat-area {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 22px 26px 10px;
            scroll-behavior: smooth;
        }
        .chat-area::-webkit-scrollbar { width: 9px; }
        .chat-area::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--grass-300), var(--grass-500));
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: content-box;
        }
        .chat-area::-webkit-scrollbar-track { background: transparent; }

        .msg {
            display: flex;
            gap: 11px;
            margin-bottom: 18px;
            animation: msgIn .42s cubic-bezier(.22, 1, .36, 1) both;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: none; }
        }
        .msg.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 40px; height: 40px;
            flex: 0 0 auto;
            border-radius: 50%;
            overflow: hidden;
            background: #fff;
            border: 2px solid var(--gold-soft);
            box-shadow: 0 5px 14px rgba(59, 165, 93, .18);
        }
        .msg.user .msg-avatar {
            border-color: var(--grass-300);
            background: #fff;
        }

        /* 头像图片：铺满容器并按比例裁切 */
        .avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        /* 用户头像也是图片，因此不再隐藏（原版用 emoji，这里改为图片） */
        .welcome .welcome-portrait .avatar-img { object-position: 50% 22%; }

        /* 宽度策略：
           .msg-body 用 fit-content 而非 auto —— 否则 flex 子项会按 min-content 收缩，
           配合任何「任意处断行」属性就会塌成"每列一个字"。
           .bubble 不再设 min-width：那会把「正在思考」的三点气泡也撑成长条（已踩过这个坑），
           改为 width: 100% 占满 .msg-body，由 .msg-body 的 max-width 统一约束。 */
        .msg-body {
            width: fit-content;
            max-width: min(72%, 780px);
            min-width: 0;            /* 允许 flex 收缩，避免撑破容器 */
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .msg.user .msg-body { align-items: flex-end; }

        .bubble {
            position: relative;
            padding: 13px 17px;
            border-radius: var(--radius-lg);
            font-size: 14.5px;
            line-height: 1.78;
            width: 100%;
            max-width: 100%;
            word-break: break-word;
            overflow-wrap: break-word;      /* 不能用 anywhere：那会抹掉 min-content 宽度 */
            box-shadow: var(--shadow-soft);
        }
        .msg.bot .bubble {
            background: var(--bubble-bot);
            border: 1.5px solid rgba(142, 214, 166, .75);
            border-top-left-radius: 7px;
            color: var(--ink);
        }
        .msg.user .bubble {
            background: linear-gradient(135deg, var(--bubble-user-a), var(--bubble-user-b));
            color: #ffffff;
            border-top-right-radius: 7px;
            box-shadow: 0 10px 26px rgba(59, 165, 93, .28);
        }
        .msg.error .bubble {
            background: #fff7f4;
            border-color: #f3c9b8;
            color: #a4532f;
        }
        .msg-time { font-size: 11px; color: var(--ink-soft); padding: 0 6px; }

        /* 气泡内容排版（自写轻量 Markdown） */
        .bubble p { margin: 0 0 9px; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble h1, .bubble h2, .bubble h3 {
            margin: 12px 0 7px;
            font-size: 15px;
            color: var(--grass-900);
            letter-spacing: .3px;
        }
        .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
        .bubble .bubble-title {
            display: inline-block;
            margin-bottom: 8px;
            padding: 2px 10px;
            font-size: 12px;
            border-radius: 999px;
            background: var(--grass-100);
            border: 1px solid rgba(142, 214, 166, .9);
            color: var(--grass-700);
        }
        .bubble ul, .bubble ol { margin: 6px 0 9px; padding-left: 21px; }
        .bubble li { margin-bottom: 5px; }
        .bubble li::marker { color: var(--grass-500); }
        .bubble blockquote {
            margin: 8px 0;
            padding: 7px 13px;
            border-left: 3px solid var(--gold);
            background: rgba(240, 220, 174, .22);
            border-radius: 0 10px 10px 0;
            color: #5c6b60;
        }
        .bubble pre {
            margin: 9px 0;
            padding: 11px 13px;
            background: #22332a;
            color: #d7f0dd;
            border-radius: 12px;
            overflow-x: auto;
            font-size: 12.5px;
            line-height: 1.6;
        }
        .bubble code {
            font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
            background: rgba(59, 165, 93, .13);
            color: var(--grass-700);
            padding: 1.5px 6px;
            border-radius: 6px;
            font-size: 12.5px;
        }
        .bubble pre code { background: none; color: inherit; padding: 0; }
        .bubble strong { color: var(--grass-700); }
        /* 流式输出光标：作为气泡最后一个子元素，不参与 markdown 重渲染 */
        .bubble .stream-caret {
            display: inline-block;
            width: 2px;
            height: 1em;
            margin-left: 3px;
            vertical-align: -2px;
            background: var(--grass-500);
            border-radius: 1px;
            animation: caretBlink .9s steps(1, end) infinite;
        }
        @keyframes caretBlink {
            0%, 49%   { opacity: 1; }
            50%, 100% { opacity: .12; }
        }

        /* ---------- 打字中指示 ---------- */
        .typing-bubble {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 14px 18px;
        }
        .typing-bubble i {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--grass-500);
            animation: typing 1.3s ease-in-out infinite;
        }
        .typing-bubble i:nth-child(2) { animation-delay: .18s; }
        .typing-bubble i:nth-child(3) { animation-delay: .36s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: .42; }
            30%           { transform: translateY(-6px); opacity: 1; }
        }
        /* 等待期间的阶段提示文字：让用户知道系统正在做什么，避免"像卡住了" */
        .typing-text {
            font-size: 13px;
            color: var(--ink-soft);
            letter-spacing: .3px;
            animation: fadeSwap .35s ease both;
        }
        @keyframes fadeSwap {
            from { opacity: 0; transform: translateY(3px); }
            to   { opacity: 1; transform: none; }
        }

        /* ---------- 欢迎卡片 ---------- */
        .welcome { text-align: center; padding: 12px 0 4px; animation: msgIn .6s both; }
        .welcome h2 {
            margin: 14px 0 6px;
            font-size: 20px;
            color: var(--grass-900);
            letter-spacing: .6px;
        }
        .welcome .welcome-sub { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.9; }
        .welcome .welcome-portrait {
            width: 128px; height: 128px;
            margin: 0 auto;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 40%, #ffffff, #eef8ee 68%, #dcf0dd);
            border: 2.5px solid var(--gold-soft);
            box-shadow: 0 16px 38px rgba(59, 165, 93, .22);
            overflow: hidden;
            animation: brandFloat 5s ease-in-out infinite;
        }
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px auto 4px;
            max-width: 640px;
        }
        .chip {
            border: 1.5px solid rgba(142, 214, 166, .95);
            background: #ffffff;
            color: var(--grass-700);
            font-size: 12.5px;
            font-family: inherit;
            padding: 9px 15px;
            border-radius: 999px;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
            box-shadow: 0 5px 14px rgba(59, 165, 93, .12);
        }
        .chip:hover { transform: translateY(-2px); background: var(--grass-100); box-shadow: 0 9px 20px rgba(59, 165, 93, .22); }
        .chip:active { transform: translateY(0) scale(.98); }

        /* ---------- 输入区 ---------- */
        .composer {
            flex: 0 0 auto;
            padding: 14px 22px 18px;
            background: linear-gradient(0deg, rgba(238, 246, 234, .95), rgba(255, 255, 255, .6));
            border-top: 1.5px dashed rgba(217, 178, 106, .55);
        }
        .composer-inner {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            padding: 8px 8px 8px 16px;
            background: #ffffff;
            border: 2px solid rgba(142, 214, 166, .8);
            border-radius: 20px;
            transition: border-color .22s ease, box-shadow .22s ease;
        }
        .composer-inner:focus-within {
            border-color: var(--grass-500);
            box-shadow: 0 0 0 5px rgba(142, 214, 166, .26);
        }
        #question {
            flex: 1 1 auto;
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 14.5px;
            line-height: 1.68;
            color: var(--ink);
            background: transparent;
            padding: 9px 0;
            max-height: 132px;
            min-height: 22px;
        }
        #question::placeholder { color: #a9bdb0; }
        .send-btn {
            flex: 0 0 auto;
            width: 46px; height: 46px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--grass-500), var(--grass-700));
            color: #fff;
            display: grid;
            place-items: center;
            box-shadow: 0 8px 20px rgba(59, 165, 93, .34);
            transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
        }
        .send-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(59, 165, 93, .42); }
        .send-btn:active:not(:disabled) { transform: scale(.95); }
        .send-btn:disabled { filter: grayscale(.75) opacity(.55); cursor: not-allowed; box-shadow: none; }
        .hint {
            margin: 9px 4px 0;
            font-size: 11.5px;
            color: var(--ink-soft);
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .hint kbd {
            font-family: inherit;
            background: #eef6ea;
            border: 1px solid rgba(142, 214, 166, .9);
            border-bottom-width: 2px;
            border-radius: 6px;
            padding: 1px 6px;
            font-size: 11px;
            color: var(--grass-700);
        }

        @media (max-width: 720px) {
            body { padding: 0; }
            .app { height: 100vh; width: 100%; border-radius: 0; border: none; }
            .chat-area { padding: 16px 12px 8px; }
            .msg-body { width: 100%; max-width: 86%; }
            .brand-sub { display: none; }
            .composer { padding: 10px 12px 14px; }
            .composer-inner { padding-left: 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
        }

        /* ---------- 流式输出（重写后新增） ---------- */
        /* 纯文本流式内容：pre-wrap 保留换行，且保证中文横向排版 */
        .stream-text {
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: break-word;
            min-width: 0;
        }
        /* pre-wrap 会撑大三点指示器的空隙，这里还原为紧凑排列 */
        .typing-bubble { white-space: normal; }
    </style>
</head>
<body>


<!-- 背景装饰层 -->
<div class="bg-layer" aria-hidden="true">
    <div class="glow-orb" style="width:340px;height:340px;left:-90px;top:6%;background:#bde9c6;"></div>
    <div class="glow-orb" style="width:300px;height:300px;right:-70px;top:22%;background:#f6e3b6;animation-delay:1.4s;"></div>
    <div class="glow-orb" style="width:280px;height:280px;left:38%;bottom:-90px;background:#cbe6ff;animation-delay:2.6s;"></div>
</div>

<!-- 主界面 -->
<main class="app">
    <header class="topbar">
        <div class="brand-text">
            <h1 class="brand-title"><span class="clover">🌿</span>LawChain · 律衡</h1>
            <p class="brand-sub">LEGAL RAG ASSISTANT · 以法为衡</p>
        </div>
        <div class="status-chip" id="statusChip" data-state="connecting">
            <span class="status-dot"></span>
            <span id="statusText">连接中</span>
            <span class="latency" id="latency"></span>
        </div>
    </header>

    <section class="chat-area" id="chatArea" aria-live="polite">
        <div class="welcome" id="welcome">
            <div class="welcome-portrait">
                <img class="avatar-img" src="/static/data/头像.jpg" alt="律衡">
            </div>
            <h2>你好呀，我是律衡 🌱</h2>
            <p class="welcome-sub">
                把法律问题交给我吧，我会先去缓存里找找看，<br>
                再去法典与案例中检索，最后为你整理成一段好懂的答案。
            </p>
            <div class="chips">
                <button class="chip" data-q="劳动合同到期不续签，公司需要支付经济补偿吗？">劳动合同到期不续签，要赔经济补偿吗？</button>
                <button class="chip" data-q="租房押金不退怎么办？">租房押金不退怎么办？</button>
                <button class="chip" data-q="网购商品七天无理由退货的法律依据是什么？">网购七天无理由退货的依据？</button>
                <button class="chip" data-q="民间借贷没有借条，仅有转账记录可以起诉吗？">只有转账记录能起诉借贷吗？</button>
            </div>
        </div>
    </section>

    <footer class="composer">
        <div class="composer-inner">
            <textarea id="question" rows="1" placeholder="描述你的法律问题，比如：工伤认定需要哪些材料？"
                      autocomplete="off" aria-label="输入你的问题"></textarea>
            <button class="send-btn" id="sendBtn" title="发送 (Enter)" aria-label="发送" disabled>
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M4.4 12 20 4.6 15.2 20 12.3 13.7 4.4 12 Z" fill="currentColor"/>
                    <path d="M12.3 13.7 20 4.6" stroke="#ffffff" stroke-width="1.1" opacity=".65"/>
                </svg>
            </button>
        </div>
        <div class="hint">
            <span><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
            <span id="connHint">正在连接知识库…</span>
        </div>
    </footer>
</main>


<script>
(function () {
    'use strict';

    /* ============================================================
     * 常量
     * ============================================================ */
    var WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/chat';
    var HEARTBEAT_INTERVAL = 30000;   // 与服务端 HEARTBEAT_INTERVAL 一致
    var WATCHDOG_TIMEOUT = 120000;    // 120s 收不到任何服务端帧则判定假死
    var MAX_RECONNECT_DELAY = 15000;
    var PENDING_MAX = 20;
    var AVATAR_SRC = '/static/data/头像.jpg';
    var USER_AVATAR_SRC = '/static/data/用户头像.jpg';

    /* ============================================================
     * DOM
     * ============================================================ */
    var chatArea = document.getElementById('chatArea');
    var welcome = document.getElementById('welcome');
    var input = document.getElementById('question');
    var sendBtn = document.getElementById('sendBtn');
    var statusChip = document.getElementById('statusChip');
    var statusText = document.getElementById('statusText');
    var latencyEl = document.getElementById('latency');
    var connHint = document.getElementById('connHint');

    /* ============================================================
     * 小工具
     * ============================================================ */
    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function nowTime() {
        var d = new Date(), p = function (n) { return n < 10 ? '0' + n : '' + n; };
        return p(d.getHours()) + ':' + p(d.getMinutes());
    }

    function toBottom() {
        if (chatArea) { chatArea.scrollTop = chatArea.scrollHeight; }
    }

    function makeAvatar(role) {
        var box = document.createElement('div');
        box.className = 'msg-avatar';

        var isUser = (role === 'user');
        var img = document.createElement('img');
        img.className = 'avatar-img';
        img.src = isUser ? USER_AVATAR_SRC : AVATAR_SRC;
        img.alt = isUser ? '我' : '律衡';
        // 图片加载失败也不影响布局：退化为一个字符
        img.onerror = function () {
            img.style.display = 'none';
            box.textContent = isUser ? '🧑' : '🌿';
            box.style.display = 'grid';
            box.style.placeItems = 'center';
            box.style.fontSize = isUser ? '19px' : '20px';
        };
        box.appendChild(img);
        return box;
    }

    function dropWelcome() {
        try {
            if (welcome && welcome.parentNode) { welcome.parentNode.removeChild(welcome); }
        } catch (e) { /* 忽略 */ }
        welcome = null;
    }

    /* ============================================================
     * 极简 Markdown 渲染（先转义，再套标签）
     * 只用最基础的规则，降低出错概率
     * ============================================================ */
    function md(raw) {
        var text = esc(raw).replace(/\r\n?/g, '\n');
        var lines = text.split('\n');
        var out = [];
        var list = null;        // 'ul' | 'ol' | null
        var para = [];
        var code = null;        // 代码块缓冲

        function closeList() {
            if (list) { out.push('</' + list + '>'); list = null; }
        }
        function flushPara() {
            if (para.length) {
                out.push('<p>' + para.join('<br>') + '</p>');
                para = [];
            }
        }
        function flushAll() { flushPara(); closeList(); }

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i];

            if (/^\s*```/.test(line)) {
                if (code === null) { flushAll(); code = []; }
                else { out.push('<pre><code>' + code.join('\n') + '</code></pre>'); code = null; }
                continue;
            }
            if (code !== null) { code.push(line); continue; }

            if (!line.trim()) { flushAll(); continue; }

            var h = line.match(/^(#{1,6})\s+(.*)$/);
            if (h) {
                flushAll();
                var lv = Math.min(Math.max(h[1].length, 1), 3);
                out.push('<h' + lv + '>' + h[2].trim() + '</h' + lv + '>');
                continue;
            }

            var ul = line.match(/^\s*[-*•]\s+(.*)$/);
            if (ul) {
                flushPara();
                if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
                out.push('<li>' + ul[1] + '</li>');
                continue;
            }

            var ol = line.match(/^\s*\d+[.、)]\s+(.*)$/);
            if (ol) {
                flushPara();
                if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; }
                out.push('<li>' + ol[1] + '</li>');
                continue;
            }

            var bq = line.match(/^\s*&gt;\s?(.*)$/);
            if (bq) { flushAll(); out.push('<blockquote>' + bq[1] + '</blockquote>'); continue; }

            closeList();
            para.push(line.trim());
        }

        if (code !== null) { out.push('<pre><code>' + code.join('\n') + '</code></pre>'); }
        flushAll();

        // 行内强调
        var joined = out.join('');
        joined = joined.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
        joined = joined.replace(/`([^`\n]+)`/g, '<code>$1</code>');
        return joined;
    }

    /* 渲染失败时降级为纯文本，绝不抛给调用方 */
    function safeMd(raw) {
        try {
            return md(raw);
        } catch (e) {
            console.warn('[LawChain] markdown 渲染失败，改用纯文本', e);
            return '<span class="stream-text">' + esc(raw) + '</span>';
        }
    }

    /* ============================================================
     * 消息构建
     * ============================================================ */
    function buildMessage(role, isError) {
        var wrap = document.createElement('div');
        wrap.className = 'msg ' + role + (isError ? ' error' : '');

        var body = document.createElement('div');
        body.className = 'msg-body';

        var bubble = document.createElement('div');
        bubble.className = 'bubble';

        var time = document.createElement('div');
        time.className = 'msg-time';
        time.textContent = nowTime();

        body.appendChild(bubble);
        body.appendChild(time);
        wrap.appendChild(makeAvatar(role));
        wrap.appendChild(body);
        return { wrap: wrap, body: body, bubble: bubble, time: time };
    }

    /* 完整消息：用于用户提问、错误提示、非流式回答 */
    function addFullMessage(role, text, isError) {
        dropWelcome();
        var m = buildMessage(role, isError);
        if (role === 'user') {
            m.bubble.textContent = text;
        } else {
            m.bubble.innerHTML = safeMd(text);
        }
        if (chatArea) { chatArea.appendChild(m.wrap); }
        toBottom();
    }

    /* ============================================================
     * 流式：单个气泡
     * 流式期间用纯文本（pre-wrap，绝不竖排）；结束时一次性渲染 markdown
     * ============================================================ */
    var S = { open: false, wrap: null, body: null, bubble: null, text: null, raw: '' };

    /* 会话 ID：由服务端在 WebSocket 连接建立时下发，提问时回传。
       刷新页面会换新连接 → 换新会话（会话边界 = 一条连接）。 */
    var sessionId = '';

    function streamBegin() {
        dropWelcome();
        var m = buildMessage('bot', false);
        var span = document.createElement('span');
        span.className = 'stream-text';
        span.textContent = '';
        m.bubble.appendChild(span);

        if (chatArea) { chatArea.appendChild(m.wrap); }

        S.open = true;
        S.wrap = m.wrap; S.body = m.body; S.bubble = m.bubble; S.text = span; S.raw = '';
        toBottom();
    }

    function streamDelta(piece) {
        if (!S.text) { return; }
        S.raw += piece;
        try {
            S.text.textContent = S.raw;
        } catch (e) {
            console.warn('[LawChain] 更新流式文本失败', e);
        }
        toBottom();
    }

    function streamEnd() {
        if (!S.open) { return; }
        // 收尾渲染：失败也不影响已有纯文本
        if (S.bubble) {
            try {
                S.bubble.innerHTML = safeMd(S.raw);
            } catch (e) { /* 保留纯文本 */ }
        }
        S.open = false; S.wrap = null; S.body = null; S.bubble = null; S.text = null; S.raw = '';
        toBottom();
    }

    function streamReset() {
        S.open = false; S.wrap = null; S.body = null; S.bubble = null; S.text = null; S.raw = '';
    }

    /* ============================================================
     * 三点思考指示器
     * ============================================================ */
    var typingEl = null;      // 指示器整条消息
    var typingText = null;    // 其中的阶段文字节点

    /* 显示等待指示器；text 为阶段提示，会一直保留到第一个字到来 */
    function showTyping(text) {
        if (typingEl) { setTypingText(text); return; }
        dropWelcome();
        var m = buildMessage('bot', false);
        m.bubble.className = 'bubble typing-bubble';
        m.bubble.appendChild(document.createElement('i'));
        m.bubble.appendChild(document.createElement('i'));
        m.bubble.appendChild(document.createElement('i'));

        typingText = document.createElement('span');
        typingText.className = 'typing-text';
        typingText.textContent = text || '正在检索法规与案例…';
        m.bubble.appendChild(typingText);

        if (chatArea) { chatArea.appendChild(m.wrap); }
        typingEl = m.wrap;
        toBottom();
    }

    /* 更新阶段提示（重新触发淡入动画） */
    function setTypingText(text) {
        if (!typingText || !text || typingText.textContent === text) { return; }
        var parent = typingText.parentNode;
        if (!parent) { return; }
        var fresh = document.createElement('span');
        fresh.className = 'typing-text';
        fresh.textContent = text;
        parent.replaceChild(fresh, typingText);
        typingText = fresh;
        toBottom();
    }

    function hideTyping() {
        try {
            if (typingEl && typingEl.parentNode) { typingEl.parentNode.removeChild(typingEl); }
        } catch (e) { /* 忽略 */ }
        typingEl = null;
        typingText = null;
    }

    /* ============================================================
     * 连接
     * ============================================================ */
    var socket = null;
    var hbTimer = null;
    var watchdog = null;
    var reconnectTimer = null;
    var retry = 0;
    var lastPing = 0;
    var pending = [];
    var closing = false;

    var LABEL = { connected: '已连接', connecting: '连接中', offline: '已断开' };

    function setStatus(name, note) {
        if (statusChip) { statusChip.setAttribute('data-state', name); }
        if (statusText) { statusText.textContent = LABEL[name] || name; }
        if (connHint && note) { connHint.textContent = note; }
        if (name !== 'connected' && latencyEl) { latencyEl.textContent = ''; }
    }

    function isOpen() { return socket !== null && socket.readyState === WebSocket.OPEN; }

    function send(obj) {
        if (!isOpen()) { return false; }
        try { socket.send(JSON.stringify(obj)); return true; }
        catch (e) { return false; }
    }

    function clearTimers() {
        if (hbTimer) { clearInterval(hbTimer); hbTimer = null; }
        if (watchdog) { clearTimeout(watchdog); watchdog = null; }
    }

    function armWatchdog() {
        if (watchdog) { clearTimeout(watchdog); }
        watchdog = setTimeout(function () {
            if (isOpen()) {
                console.warn('[LawChain] 看门狗超时，主动重连');
                try { socket.close(4000, 'watchdog'); } catch (e) { /* 忽略 */ }
            }
        }, WATCHDOG_TIMEOUT);
    }

    function startHeartbeat() {
        clearTimers();
        armWatchdog();
        hbTimer = setInterval(function () {
            if (isOpen()) { lastPing = Date.now(); send({ type: 'ping' }); }
        }, HEARTBEAT_INTERVAL);
    }

    function scheduleReconnect() {
        if (closing || reconnectTimer) { return; }
        var delay = Math.min(1000 * Math.pow(2, retry), MAX_RECONNECT_DELAY);
        retry += 1;
        setStatus('offline', '连接已断开，' + Math.round(delay / 1000) + ' 秒后重连…');
        reconnectTimer = setTimeout(function () {
            reconnectTimer = null;
            connect();
        }, delay);
    }

    /* 处理一帧服务端消息 */
    function onFrame(payload) {
        switch (payload.type) {
            case 'session':
                // 服务端在连接建立时下发会话 ID，之后每次提问都要回传它
                sessionId = payload.session_id || '';
                break;

            case 'stage':
                // 处理阶段动态提示（正在理解您的问题… → 判断类型 → 检索 → 生成）
                // 若首个 token 还没来，就只更新等待气泡的文案；已经开流则忽略，
                // 避免把答案气泡的提示又改回去。
                if (!S.open && payload.text) {
                    setTypingText(payload.text);
                }
                break;

            case 'ping':
                send({ type: 'pong' });
                break;

            case 'pong':
                if (lastPing && latencyEl) {
                    latencyEl.textContent = (Date.now() - lastPing) + ' ms';
                    lastPing = 0;
                }
                break;

            case 'answer_start':
                // 关键：这里【不收掉】等待指示器。
                // 服务端在 answer_start 之后往往还要等 LLM 出第一个 token（可能数秒），
                // 若此刻就撤掉指示器、开一个空气泡，用户会看到"气泡空白"以为卡死。
                // 正确做法：指示器留到第一个字真正到来（见 answer_delta），只更新阶段文案。
                streamReset();
                setTypingText('正在生成回答…');
                break;

            case 'answer_delta':
                if (!S.open) {
                    // 第一个字到了 —— 此刻才撤掉指示器、建立气泡，两者无缝衔接
                    hideTyping();
                    streamBegin();
                }
                streamDelta(payload.text || '');
                break;

            case 'answer_end':
                // 注意：streamEnd() 会清空 S.raw，所以必须在收尾【之前】判断是否有内容
                if (S.open && S.raw !== '') {
                    streamEnd();
                    hideTyping();
                } else {
                    // 有 answer_start 但一个 delta 都没来（或内容为空）：
                    // 不要留下空白气泡，直接给一句明确提示
                    streamReset();
                    hideTyping();
                    addFullMessage('bot', '抱歉，没有查询到相关内容呢 QAQ', false);
                }
                break;

            /* 一次性回答（缓存 / BM25 / 空问题 / 无结果） */
            case 'answer':
                hideTyping();
                streamReset();
                addFullMessage('bot', payload.text || '（没有返回内容）', false);
                break;

            case 'error':
                hideTyping();
                streamReset();
                addFullMessage('bot', payload.text || '服务端处理出错了。', true);
                break;

            default:
                if (payload.text) {
                    hideTyping();
                    streamReset();
                    addFullMessage('bot', payload.text, false);
                }
        }
    }

    function connect() {
        if (socket && (socket.readyState === WebSocket.OPEN ||
                       socket.readyState === WebSocket.CONNECTING)) { return; }
        setStatus('connecting', '正在连接…');
        try {
            socket = new WebSocket(WS_URL);
        } catch (e) {
            scheduleReconnect();
            return;
        }

        socket.onopen = function () {
            retry = 0;
            setStatus('connected', '已连接，随时可以提问');
            startHeartbeat();
            var queued = pending.slice();
            pending = [];
            queued.forEach(function (q) { ask(q); });
        };

        socket.onmessage = function (ev) {
            armWatchdog();
            var payload;
            try { payload = JSON.parse(ev.data); }
            catch (e) { payload = { type: 'answer', text: ev.data }; }
            if (typeof payload === 'string') { payload = { type: 'answer', text: payload }; }
            if (payload && typeof payload === 'object' && payload.type) {
                try { onFrame(payload); }
                catch (e) { console.error('[LawChain] 处理消息出错', e, payload); }
            }
        };

        socket.onerror = function () { console.warn('[LawChain] WebSocket 异常'); };

        socket.onclose = function () {
            clearTimers();
            hideTyping();
            streamReset();
            socket = null;
            if (closing) { setStatus('offline', '连接已关闭'); return; }
            scheduleReconnect();
        };
    }

    /* ============================================================
     * 提问
     * ============================================================ */
    function ask(raw) {
        var text = String(raw == null ? '' : raw).trim();
        if (!text) { return; }

        hideTyping();
        streamReset();
        addFullMessage('user', text, false);

        if (!isOpen()) {
            if (pending.length < PENDING_MAX) {
                pending.push(text);
                addFullMessage('bot', '连接还没就绪，这条问题我先记下，连上后立刻替你查～', true);
                if (!reconnectTimer && !closing) { connect(); }
            } else {
                addFullMessage('bot', '积压的问题太多了，等连接恢复后再问吧 QAQ', true);
            }
            return;
        }

        // 先给出阶段提示：命中缓存/关键词会很快被 answer 帧替换，
        // 未命中则要经历 指代消解 → 检索分类 → 问题改写 → 向量检索+重排 → LLM 生成，可能数秒
        showTyping('正在理解您的问题…');
        send({ type: 'question', text: text, session_id: sessionId });
    }

    /* ============================================================
     * 输入区
     * ============================================================ */
    function autoGrow() {
        if (!input) { return; }
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 132) + 'px';
    }

    function refreshBtn() {
        if (sendBtn && input) { sendBtn.disabled = input.value.trim().length === 0; }
    }

    function submit() {
        if (!input) { return; }
        var text = input.value.trim();
        if (!text) { return; }
        input.value = '';
        autoGrow();
        refreshBtn();
        ask(text);
        input.focus();
    }

    /* ============================================================
     * 事件绑定
     * ============================================================ */
    if (input) {
        input.addEventListener('input', function () { autoGrow(); refreshBtn(); });
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                submit();
            }
        });
    }
    if (sendBtn) { sendBtn.addEventListener('click', submit); }
    if (welcome) {
        welcome.addEventListener('click', function (e) {
            var chip = e.target.closest ? e.target.closest('.chip') : null;
            if (!chip) { return; }
            ask(chip.getAttribute('data-q') || chip.textContent);
        });
    }

    document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && !isOpen() && !closing && !reconnectTimer) {
            retry = 0;
            connect();
        }
    });

    window.addEventListener('beforeunload', function () {
        closing = true;
        clearTimers();
        if (socket) { try { socket.close(1000, 'unload'); } catch (e) { /* 忽略 */ } }
    });

    /* 背景漂浮叶片（纯装饰，失败不影响功能） */
    (function decorate() {
        try {
            var layer = document.querySelector('.bg-layer');
            if (!layer) { return; }
            var glyphs = ['🌿', '🍃', '☘️', '✨'];
            for (var i = 0; i < 14; i++) {
                var leaf = document.createElement('span');
                leaf.className = 'leaf';
                leaf.textContent = glyphs[i % glyphs.length];
                leaf.style.left = (Math.random() * 96) + '%';
                leaf.style.fontSize = (14 + Math.random() * 16) + 'px';
                leaf.style.animationDuration = (14 + Math.random() * 14) + 's';
                leaf.style.animationDelay = (-Math.random() * 20) + 's';
                layer.appendChild(leaf);
            }
        } catch (e) { /* 忽略 */ }
    })();

    /* 启动 */
    autoGrow();
    refreshBtn();
    connect();
})();
</script>
</body>
</html>
