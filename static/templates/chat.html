<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LawChain · 纳西妲的法律问答</title>
    <style>
        :root {
            --grass-900: #1f4d33;
            --grass-700: #2f7d4f;
            --grass-500: #3ba55d;
            --grass-300: #8ed6a6;
            --grass-100: #e2f5e4;
            --cream: #f8fbf5;
            --cream-2: #eef6ea;
            --gold: #d9b26a;
            --gold-soft: #f0dcae;
            --ink: #2c3a31;
            --ink-soft: #6d8175;
            --bubble-bot: #ffffff;
            --bubble-user-a: #8ed6a6;
            --bubble-user-b: #3ba55d;
            --radius-lg: 22px;
            --radius-md: 16px;
            --shadow-soft: 0 10px 30px rgba(47, 125, 79, .12);
            --shadow-card: 0 18px 50px rgba(31, 77, 51, .16);
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; margin: 0; }

        body {
            font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1100px 700px at 12% -10%, #dff3e0 0%, rgba(223, 243, 224, 0) 60%),
                radial-gradient(900px 620px at 108% 8%, #fdf3dc 0%, rgba(253, 243, 220, 0) 58%),
                radial-gradient(800px 600px at 50% 120%, #e6f2ff 0%, rgba(230, 242, 255, 0) 60%),
                var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
            overflow: hidden;
            position: relative;
        }

        /* ---------- 背景装饰：漂浮叶片与光点 ---------- */
        .bg-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .leaf {
            position: absolute;
            font-size: 22px;
            opacity: .38;
            filter: drop-shadow(0 4px 8px rgba(59, 165, 93, .22));
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0%   { transform: translate3d(0, 12vh, 0) rotate(0deg) scale(.85); opacity: 0; }
            12%  { opacity: .42; }
            88%  { opacity: .42; }
            100% { transform: translate3d(34px, -108vh, 0) rotate(210deg) scale(1.05); opacity: 0; }
        }
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(46px);
            opacity: .5;
            animation: orbPulse ease-in-out infinite alternate;
        }
        @keyframes orbPulse {
            from { transform: scale(1) translateY(0); opacity: .38; }
            to   { transform: scale(1.16) translateY(-18px); opacity: .6; }
        }

        /* ---------- 主容器 ---------- */
        .app {
            position: relative;
            z-index: 2;
            width: min(1080px, 100%);
            height: min(880px, calc(100vh - 44px));
            background: rgba(255, 255, 255, .82);
            backdrop-filter: blur(14px);
            border: 2px solid rgba(217, 178, 106, .55);
            border-radius: 28px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: appIn .6s cubic-bezier(.22, 1, .36, 1) both;
        }
        @keyframes appIn {
            from { opacity: 0; transform: translateY(18px) scale(.98); }
            to   { opacity: 1; transform: none; }
        }

        /* ---------- 顶栏 ---------- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 22px;
            background: linear-gradient(120deg, rgba(226, 245, 228, .95), rgba(253, 248, 235, .9));
            border-bottom: 1.5px dashed rgba(217, 178, 106, .6);
        }
        .brand-avatar {
            width: 50px; height: 50px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid var(--gold-soft);
            box-shadow: 0 6px 16px rgba(59, 165, 93, .22);
            overflow: hidden;
            animation: brandFloat 4.4s ease-in-out infinite;
        }
        @keyframes brandFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-4px); }
        }
        .brand-text { flex: 1 1 auto; min-width: 0; }
        .brand-title {
            margin: 0;
            font-size: 17px;
            letter-spacing: .5px;
            color: var(--grass-900);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-title .clover { font-size: 15px; }
        .brand-sub {
            margin: 3px 0 0;
            font-size: 12px;
            color: var(--ink-soft);
            letter-spacing: .3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .status-chip {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 13px;
            border-radius: 999px;
            background: #ffffff;
            border: 1.5px solid rgba(217, 178, 106, .55);
            font-size: 12px;
            color: var(--grass-900);
            box-shadow: 0 4px 12px rgba(59, 165, 93, .12);
            white-space: nowrap;
        }
        .status-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #c9d3cd;
            flex: 0 0 auto;
            transition: background .3s ease;
        }
        .status-chip[data-state="connected"] .status-dot {
            background: var(--grass-500);
            box-shadow: 0 0 0 0 rgba(59, 165, 93, .55);
            animation: dotPulse 2s infinite;
        }
        .status-chip[data-state="connecting"] .status-dot { background: var(--gold); animation: dotPulse 1.1s infinite; }
        .status-chip[data-state="offline"] .status-dot { background: #e28b8b; }
        @keyframes dotPulse {
            0%   { box-shadow: 0 0 0 0 rgba(59, 165, 93, .5); }
            70%  { box-shadow: 0 0 0 8px rgba(59, 165, 93, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 165, 93, 0); }
        }
        .latency { color: var(--ink-soft); font-variant-numeric: tabular-nums; }

        /* ---------- 消息流 ---------- */
        .chat-area {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 22px 26px 10px;
            scroll-behavior: smooth;
        }
        .chat-area::-webkit-scrollbar { width: 9px; }
        .chat-area::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--grass-300), var(--grass-500));
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: content-box;
        }
        .chat-area::-webkit-scrollbar-track { background: transparent; }

        .msg {
            display: flex;
            gap: 11px;
            margin-bottom: 18px;
            animation: msgIn .42s cubic-bezier(.22, 1, .36, 1) both;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: none; }
        }
        .msg.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 40px; height: 40px;
            flex: 0 0 auto;
            border-radius: 50%;
            overflow: hidden;
            background: #fff;
            border: 2px solid var(--gold-soft);
            box-shadow: 0 5px 14px rgba(59, 165, 93, .18);
        }
        .msg.user .msg-avatar {
            border-color: var(--grass-300);
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(145deg, var(--grass-100), #ffffff);
            font-size: 19px;
        }

        /* 头像图片：铺满容器并按比例裁切 */
        .avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .msg.user .avatar-img { display: none; }
        .welcome .welcome-portrait .avatar-img { object-position: 50% 22%; }

        .msg-body { max-width: min(72%, 640px); display: flex; flex-direction: column; gap: 5px; }
        .msg.user .msg-body { align-items: flex-end; }

        .bubble {
            position: relative;
            padding: 13px 17px;
            border-radius: var(--radius-lg);
            font-size: 14.5px;
            line-height: 1.78;
            word-break: break-word;
            overflow-wrap: anywhere;
            box-shadow: var(--shadow-soft);
        }
        .msg.bot .bubble {
            background: var(--bubble-bot);
            border: 1.5px solid rgba(142, 214, 166, .75);
            border-top-left-radius: 7px;
            color: var(--ink);
        }
        .msg.user .bubble {
            background: linear-gradient(135deg, var(--bubble-user-a), var(--bubble-user-b));
            color: #ffffff;
            border-top-right-radius: 7px;
            box-shadow: 0 10px 26px rgba(59, 165, 93, .28);
        }
        .msg.error .bubble {
            background: #fff7f4;
            border-color: #f3c9b8;
            color: #a4532f;
        }
        .msg-time { font-size: 11px; color: var(--ink-soft); padding: 0 6px; }

        /* 气泡内容排版（自写轻量 Markdown） */
        .bubble p { margin: 0 0 9px; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble h1, .bubble h2, .bubble h3 {
            margin: 12px 0 7px;
            font-size: 15px;
            color: var(--grass-900);
            letter-spacing: .3px;
        }
        .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
        .bubble .bubble-title {
            display: inline-block;
            margin-bottom: 8px;
            padding: 2px 10px;
            font-size: 12px;
            border-radius: 999px;
            background: var(--grass-100);
            border: 1px solid rgba(142, 214, 166, .9);
            color: var(--grass-700);
        }
        .bubble ul, .bubble ol { margin: 6px 0 9px; padding-left: 21px; }
        .bubble li { margin-bottom: 5px; }
        .bubble li::marker { color: var(--grass-500); }
        .bubble blockquote {
            margin: 8px 0;
            padding: 7px 13px;
            border-left: 3px solid var(--gold);
            background: rgba(240, 220, 174, .22);
            border-radius: 0 10px 10px 0;
            color: #5c6b60;
        }
        .bubble pre {
            margin: 9px 0;
            padding: 11px 13px;
            background: #22332a;
            color: #d7f0dd;
            border-radius: 12px;
            overflow-x: auto;
            font-size: 12.5px;
            line-height: 1.6;
        }
        .bubble code {
            font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
            background: rgba(59, 165, 93, .13);
            color: var(--grass-700);
            padding: 1.5px 6px;
            border-radius: 6px;
            font-size: 12.5px;
        }
        .bubble pre code { background: none; color: inherit; padding: 0; }
        .bubble strong { color: var(--grass-700); }

        /* ---------- 打字中指示 ---------- */
        .typing-bubble {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 15px 18px;
        }
        .typing-bubble i {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--grass-500);
            animation: typing 1.3s ease-in-out infinite;
        }
        .typing-bubble i:nth-child(2) { animation-delay: .18s; }
        .typing-bubble i:nth-child(3) { animation-delay: .36s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: .42; }
            30%           { transform: translateY(-6px); opacity: 1; }
        }

        /* ---------- 欢迎卡片 ---------- */
        .welcome { text-align: center; padding: 12px 0 4px; animation: msgIn .6s both; }
        .welcome h2 {
            margin: 14px 0 6px;
            font-size: 20px;
            color: var(--grass-900);
            letter-spacing: .6px;
        }
        .welcome .welcome-sub { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.9; }
        .welcome .welcome-portrait {
            width: 128px; height: 128px;
            margin: 0 auto;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 40%, #ffffff, #eef8ee 68%, #dcf0dd);
            border: 2.5px solid var(--gold-soft);
            box-shadow: 0 16px 38px rgba(59, 165, 93, .22);
            overflow: hidden;
            animation: brandFloat 5s ease-in-out infinite;
        }
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px auto 4px;
            max-width: 640px;
        }
        .chip {
            border: 1.5px solid rgba(142, 214, 166, .95);
            background: #ffffff;
            color: var(--grass-700);
            font-size: 12.5px;
            font-family: inherit;
            padding: 9px 15px;
            border-radius: 999px;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
            box-shadow: 0 5px 14px rgba(59, 165, 93, .12);
        }
        .chip:hover { transform: translateY(-2px); background: var(--grass-100); box-shadow: 0 9px 20px rgba(59, 165, 93, .22); }
        .chip:active { transform: translateY(0) scale(.98); }

        /* ---------- 输入区 ---------- */
        .composer {
            flex: 0 0 auto;
            padding: 14px 22px 18px;
            background: linear-gradient(0deg, rgba(238, 246, 234, .95), rgba(255, 255, 255, .6));
            border-top: 1.5px dashed rgba(217, 178, 106, .55);
        }
        .composer-inner {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            padding: 8px 8px 8px 16px;
            background: #ffffff;
            border: 2px solid rgba(142, 214, 166, .8);
            border-radius: 20px;
            transition: border-color .22s ease, box-shadow .22s ease;
        }
        .composer-inner:focus-within {
            border-color: var(--grass-500);
            box-shadow: 0 0 0 5px rgba(142, 214, 166, .26);
        }
        #question {
            flex: 1 1 auto;
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 14.5px;
            line-height: 1.68;
            color: var(--ink);
            background: transparent;
            padding: 9px 0;
            max-height: 132px;
            min-height: 22px;
        }
        #question::placeholder { color: #a9bdb0; }
        .send-btn {
            flex: 0 0 auto;
            width: 46px; height: 46px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--grass-500), var(--grass-700));
            color: #fff;
            display: grid;
            place-items: center;
            box-shadow: 0 8px 20px rgba(59, 165, 93, .34);
            transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
        }
        .send-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(59, 165, 93, .42); }
        .send-btn:active:not(:disabled) { transform: scale(.95); }
        .send-btn:disabled { filter: grayscale(.75) opacity(.55); cursor: not-allowed; box-shadow: none; }
        .hint {
            margin: 9px 4px 0;
            font-size: 11.5px;
            color: var(--ink-soft);
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .hint kbd {
            font-family: inherit;
            background: #eef6ea;
            border: 1px solid rgba(142, 214, 166, .9);
            border-bottom-width: 2px;
            border-radius: 6px;
            padding: 1px 6px;
            font-size: 11px;
            color: var(--grass-700);
        }

        @media (max-width: 720px) {
            body { padding: 0; }
            .app { height: 100vh; width: 100%; border-radius: 0; border: none; }
            .chat-area { padding: 16px 14px 8px; }
            .msg-body { max-width: 86%; }
            .brand-sub { display: none; }
            .composer { padding: 10px 12px 14px; }
            .composer-inner { padding-left: 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
        }
    </style>
</head>
<body>

<!-- 背景装饰层 -->
<div class="bg-layer" aria-hidden="true">
    <div class="glow-orb" style="width:340px;height:340px;left:-90px;top:6%;background:#bde9c6;"></div>
    <div class="glow-orb" style="width:300px;height:300px;right:-70px;top:22%;background:#f6e3b6;animation-delay:1.4s;"></div>
    <div class="glow-orb" style="width:280px;height:280px;left:38%;bottom:-90px;background:#cbe6ff;animation-delay:2.6s;"></div>
</div>

<!-- 主界面 -->
<main class="app">
    <header class="topbar">
        <div class="brand-avatar">
            <img class="avatar-img" src="/static/data/nahida.jpg" alt="纳西妲">
        </div>
        <div class="brand-text">
            <h1 class="brand-title"><span class="clover">🌿</span>LawChain · 纳西妲的法律问答</h1>
            <p class="brand-sub">检索链：Redis 缓存 → MySQL 关键词（BM25）→ Milvus 向量库 → 大模型生成</p>
        </div>
        <div class="status-chip" id="statusChip" data-state="connecting">
            <span class="status-dot"></span>
            <span id="statusText">连接中</span>
            <span class="latency" id="latency"></span>
        </div>
    </header>

    <section class="chat-area" id="chatArea" aria-live="polite">
        <div class="welcome" id="welcome">
            <div class="welcome-portrait">
                <img class="avatar-img" src="/static/data/nahida.jpg" alt="纳西妲">
            </div>
            <h2>你好呀，我是纳西妲 🌱</h2>
            <p class="welcome-sub">
                把法律问题交给我吧，我会先去缓存里找找看，<br>
                再去法典与案例中检索，最后为你整理成一段好懂的答案。
            </p>
            <div class="chips">
                <button class="chip" data-q="劳动合同到期不续签，公司需要支付经济补偿吗？">劳动合同到期不续签，要赔经济补偿吗？</button>
                <button class="chip" data-q="租房押金不退怎么办？">租房押金不退怎么办？</button>
                <button class="chip" data-q="网购商品七天无理由退货的法律依据是什么？">网购七天无理由退货的依据？</button>
                <button class="chip" data-q="民间借贷没有借条，仅有转账记录可以起诉吗？">只有转账记录能起诉借贷吗？</button>
            </div>
        </div>
    </section>

    <footer class="composer">
        <div class="composer-inner">
            <textarea id="question" rows="1" placeholder="描述你的法律问题，比如：工伤认定需要哪些材料？"
                      autocomplete="off" aria-label="输入你的问题"></textarea>
            <button class="send-btn" id="sendBtn" title="发送 (Enter)" aria-label="发送" disabled>
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M4.4 12 20 4.6 15.2 20 12.3 13.7 4.4 12 Z" fill="currentColor"/>
                    <path d="M12.3 13.7 20 4.6" stroke="#ffffff" stroke-width="1.1" opacity=".65"/>
                </svg>
            </button>
        </div>
        <div class="hint">
            <span><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
            <span id="connHint">正在连接知识库…</span>
        </div>
    </footer>
</main>

<script>
(function () {
    'use strict';

    /* ============================================================
     * 常量与配置
     * ============================================================ */
    var WS_PROTOCOL = location.protocol === 'https:' ? 'wss://' : 'ws://';
    var WS_URL = WS_PROTOCOL + location.host + '/ws/chat';
    var HEARTBEAT_INTERVAL = 30000;   // 与服务端 HEARTBEAT_INTERVAL 保持一致
    var WATCHDOG_TIMEOUT = 90000;     // 90s 内收不到任何服务端帧 → 判定假死（留足 LLM 生成时间）
    var MAX_RECONNECT_DELAY = 15000;
    var PENDING_MAX = 20;             // 离线待发队列上限

    var STATUS_TEXT = {
        connected: '已连接',
        connecting: '连接中',
        offline: '已断开'
    };

    /* ============================================================
     * DOM 引用
     * ============================================================ */
    var chatArea = document.getElementById('chatArea');
    var welcome = document.getElementById('welcome');
    var input = document.getElementById('question');
    var sendBtn = document.getElementById('sendBtn');
    var statusChip = document.getElementById('statusChip');
    var statusText = document.getElementById('statusText');
    var latencyEl = document.getElementById('latency');
    var connHint = document.getElementById('connHint');

    /* ============================================================
     * 工具函数
     * ============================================================ */
    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatTime(date) {
        var d = date || new Date();
        var p = function (n) { return n < 10 ? '0' + n : '' + n; };
        return p(d.getHours()) + ':' + p(d.getMinutes());
    }

    function scrollToBottom() {
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    /* ============================================================
     * 轻量 Markdown 渲染（不引外部库，先转义再渲染，无 XSS 风险）
     * 支持：# 标题、- / * 无序、1. 有序、> 引用、``` 代码块、**粗体**、`行内代码`
     * ============================================================ */
    function inlineFormat(text) {
        var out = text;
        out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
        return out;
    }

    function renderMarkdown(raw) {
        var src = escapeHtml(String(raw == null ? '' : raw)).replace(/\r\n?/g, '\n');
        var lines = src.split('\n');
        var html = [];
        var listState = null;   // 'ul' | 'ol' | null
        var paragraph = [];
        var codeLines = null;

        function closeList() {
            if (listState) { html.push('</' + listState + '>'); listState = null; }
        }
        function flushParagraph() {
            if (paragraph.length) {
                html.push('<p>' + inlineFormat(paragraph.join('<br>')) + '</p>');
                paragraph = [];
            }
        }
        function flushAll() { flushParagraph(); closeList(); }

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i];

            // 代码块
            if (/^\s*```/.test(line)) {
                if (codeLines === null) {
                    flushAll();
                    codeLines = [];
                } else {
                    html.push('<pre><code>' + codeLines.join('\n') + '</code></pre>');
                    codeLines = null;
                }
                continue;
            }
            if (codeLines !== null) { codeLines.push(line); continue; }

            // 空行
            if (!line.trim()) { flushAll(); continue; }

            // 标题
            var h = line.match(/^(#{1,6})\s+(.*)$/);
            if (h) {
                flushAll();
                var level = Math.min(Math.max(h[1].length, 1), 3);
                html.push('<h' + level + '>' + inlineFormat(h[2].trim()) + '</h' + level + '>');
                continue;
            }

            // 分隔线
            if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { flushAll(); html.push('<hr>'); continue; }

            // 引用
            var q = line.match(/^\s*&gt;\s?(.*)$/);
            if (q) { flushAll(); html.push('<blockquote>' + inlineFormat(q[1]) + '</blockquote>'); continue; }

            // 无序列表
            var ul = line.match(/^\s*[-*•]\s+(.*)$/);
            if (ul) {
                flushParagraph();
                if (listState !== 'ul') { closeList(); html.push('<ul>'); listState = 'ul'; }
                html.push('<li>' + inlineFormat(ul[1]) + '</li>');
                continue;
            }

            // 有序列表
            var ol = line.match(/^\s*\d+[.、)]\s+(.*)$/);
            if (ol) {
                flushParagraph();
                if (listState !== 'ol') { closeList(); html.push('<ol>'); listState = 'ol'; }
                html.push('<li>' + inlineFormat(ol[1]) + '</li>');
                continue;
            }

            // 普通段落
            closeList();
            paragraph.push(line.trim());
        }

        if (codeLines !== null) { html.push('<pre><code>' + codeLines.join('\n') + '</code></pre>'); }
        flushAll();
        return html.join('');
    }

    /* ============================================================
     * 消息渲染
     * ============================================================ */
    /* 机器人的消息头像：使用 static/data/nahida.jpg */
    function botAvatarNode() {
        var img = document.createElement('img');
        img.className = 'avatar-img';
        img.src = '/static/data/nahida.jpg';
        img.alt = '纳西妲';
        return img;
    }

    function hideWelcome() {
        if (welcome && welcome.parentNode) { welcome.parentNode.removeChild(welcome); }
        welcome = null;
    }

    function addMessage(role, text, options) {
        options = options || {};
        hideWelcome();

        var wrap = document.createElement('div');
        wrap.className = 'msg ' + role + (options.error ? ' error' : '');

        var avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        if (role === 'user') {
            avatar.textContent = '🧑';
        } else {
            avatar.appendChild(botAvatarNode());
        }

        var body = document.createElement('div');
        body.className = 'msg-body';

        var bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (role === 'user') {
            bubble.textContent = text;
        } else {
            bubble.innerHTML = renderMarkdown(text);
        }

        var time = document.createElement('div');
        time.className = 'msg-time';
        time.textContent = formatTime();

        body.appendChild(bubble);
        body.appendChild(time);
        wrap.appendChild(avatar);
        wrap.appendChild(body);
        chatArea.appendChild(wrap);
        scrollToBottom();
        return wrap;
    }

    var typingEl = null;
    function showTyping() {
        if (typingEl) { return; }
        hideWelcome();
        typingEl = document.createElement('div');
        typingEl.className = 'msg bot';

        var avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.appendChild(botAvatarNode());

        var body = document.createElement('div');
        body.className = 'msg-body';
        var bubble = document.createElement('div');
        bubble.className = 'bubble typing-bubble';
        bubble.innerHTML = '<i></i><i></i><i></i>';
        body.appendChild(bubble);

        typingEl.appendChild(avatar);
        typingEl.appendChild(body);
        chatArea.appendChild(typingEl);
        scrollToBottom();
    }

    function hideTyping() {
        if (typingEl && typingEl.parentNode) { typingEl.parentNode.removeChild(typingEl); }
        typingEl = null;
    }

    /* ============================================================
     * 连接状态
     * ============================================================ */
    var socket = null;
    var state = 'connecting';
    var heartbeatTimer = null;
    var watchdogTimer = null;
    var reconnectTimer = null;
    var reconnectAttempt = 0;
    var lastPingSentAt = 0;
    var pendingQueue = [];
    var manualClose = false;

    function setStatus(next, note) {
        state = next;
        statusChip.setAttribute('data-state', next);
        statusText.textContent = STATUS_TEXT[next] || next;
        if (note) { connHint.textContent = note; }
        if (next !== 'connected') { latencyEl.textContent = ''; }
    }

    function clearTimers() {
        if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
        if (watchdogTimer) { clearTimeout(watchdogTimer); watchdogTimer = null; }
    }

    /* 看门狗：在没有收到任何服务端帧的情况下兜底判定连接假死 */
    function armWatchdog() {
        if (watchdogTimer) { clearTimeout(watchdogTimer); }
        watchdogTimer = setTimeout(function () {
            if (socket && state === 'connected') {
                console.warn('[LawChain] 心跳看门狗超时，判定连接假死，主动重连');
                try { socket.close(4000, 'watchdog timeout'); } catch (e) { /* 忽略 */ }
            }
        }, WATCHDOG_TIMEOUT);
    }

    function send(payload) {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify(payload));
            return true;
        }
        return false;
    }

    function canSend() {
        return socket !== null && socket.readyState === WebSocket.OPEN;
    }

    function scheduleReconnect() {
        if (manualClose || reconnectTimer) { return; }
        var delay = Math.min(1000 * Math.pow(2, reconnectAttempt), MAX_RECONNECT_DELAY);
        reconnectAttempt += 1;
        setStatus('offline', '连接已断开，' + Math.round(delay / 1000) + ' 秒后自动重连…');
        reconnectTimer = setTimeout(function () {
            reconnectTimer = null;
            connect();
        }, delay);
    }

    function startHeartbeat() {
        clearTimers();
        armWatchdog();
        heartbeatTimer = setInterval(function () {
            if (canSend()) {
                lastPingSentAt = Date.now();
                send({ type: 'ping' });
            }
        }, HEARTBEAT_INTERVAL);
    }

    function connect() {
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) { return; }
        setStatus('connecting', '正在连接知识库…');
        try {
            socket = new WebSocket(WS_URL);
        } catch (e) {
            scheduleReconnect();
            return;
        }

        socket.onopen = function () {
            reconnectAttempt = 0;
            setStatus('connected', '已连接，随时可以提问');
            startHeartbeat();
            // 回放离线期间积压的问题
            var queued = pendingQueue.slice();
            pendingQueue = [];
            queued.forEach(function (q) { ask(q); });
        };

        socket.onmessage = function (event) {
            armWatchdog();
            var payload;
            try {
                payload = JSON.parse(event.data);
            } catch (e) {
                payload = { type: 'answer', text: event.data };
            }
            if (typeof payload === 'string') { payload = { type: 'answer', text: payload }; }
            if (!payload || typeof payload !== 'object') { return; }

            switch (payload.type) {
                case 'ping':
                    send({ type: 'pong' });
                    break;
                case 'pong':
                    if (lastPingSentAt) {
                        latencyEl.textContent = (Date.now() - lastPingSentAt) + ' ms';
                        lastPingSentAt = 0;
                    }
                    break;
                case 'answer':
                    hideTyping();
                    addMessage('bot', payload.text || '（没有返回内容）');
                    break;
                case 'error':
                    hideTyping();
                    addMessage('bot', payload.text || '服务端处理出错了。', { error: true });
                    break;
                default:
                    if (payload.text) { hideTyping(); addMessage('bot', payload.text); }
            }
        };

        socket.onerror = function () {
            console.warn('[LawChain] WebSocket 连接异常');
        };

        socket.onclose = function () {
            clearTimers();
            hideTyping();
            socket = null;
            if (manualClose) { setStatus('offline', '连接已关闭'); return; }
            scheduleReconnect();
        };
    }

    /* ============================================================
     * 提问
     * ============================================================ */
    function ask(rawText) {
        var text = (rawText == null ? '' : String(rawText)).trim();
        if (!text) { return; }

        addMessage('user', text);

        if (!canSend()) {
            if (pendingQueue.length < PENDING_MAX) {
                pendingQueue.push(text);
                addMessage('bot', '网络好像有点晃神，这条问题我先记在小本本上，连上之后立刻替你查～', { error: true });
            } else {
                addMessage('bot', '积压的问题有点多啦，等连接恢复后再问吧 QAQ', { error: true });
            }
            if (!reconnectTimer && !manualClose) { connect(); }
            return;
        }

        showTyping();
        send({ type: 'question', text: text });
    }

    /* ============================================================
     * 事件绑定
     * ============================================================ */
    function autoGrow() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 132) + 'px';
    }

    function refreshSendBtn() {
        sendBtn.disabled = input.value.trim().length === 0;
    }

    input.addEventListener('input', function () {
        autoGrow();
        refreshSendBtn();
    });

    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            submit();
        }
    });

    sendBtn.addEventListener('click', submit);

    function submit() {
        var text = input.value.trim();
        if (!text) { return; }
        input.value = '';
        autoGrow();
        refreshSendBtn();
        ask(text);
        input.focus();
    }

    welcome.addEventListener('click', function (e) {
        var chip = e.target.closest('.chip');
        if (!chip) { return; }
        ask(chip.getAttribute('data-q') || chip.textContent);
    });

    document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && !canSend() && !manualClose && !reconnectTimer) {
            reconnectAttempt = 0;
            connect();
        }
    });

    window.addEventListener('beforeunload', function () {
        manualClose = true;
        clearTimers();
        if (socket) { try { socket.close(1000, 'page unload'); } catch (e) { /* 忽略 */ } }
    });

    /* 首帧主动探活，尽快拿到一次延迟数据 */
    setTimeout(function () {
        if (canSend()) { lastPingSentAt = Date.now(); send({ type: 'ping' }); }
    }, 800);

    /* ============================================================
     * 背景叶片装饰
     * ============================================================ */
    (function decorate() {
        var layer = document.querySelector('.bg-layer');
        if (!layer) { return; }
        var glyphs = ['🌿', '🍃', '☘️', '✨'];
        for (var i = 0; i < 14; i++) {
            var leaf = document.createElement('span');
            leaf.className = 'leaf';
            leaf.textContent = glyphs[i % glyphs.length];
            leaf.style.left = (Math.random() * 96) + '%';
            leaf.style.fontSize = (14 + Math.random() * 16) + 'px';
            leaf.style.animationDuration = (14 + Math.random() * 14) + 's';
            leaf.style.animationDelay = (-Math.random() * 20) + 's';
            layer.appendChild(leaf);
        }
    })();

    /* ============================================================
     * 启动
     * ============================================================ */
    autoGrow();
    refreshSendBtn();
    connect();
})();
</script>
</body>
</html>
